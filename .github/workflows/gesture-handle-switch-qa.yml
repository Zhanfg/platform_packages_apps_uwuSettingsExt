name: uwuSettingsExt Gesture Switch QA
on:
  push:
    branches: ["fix/**"]
    paths:
      - "src/org/uwuaosp/settingsext/interfaceui/InterfaceSettingsActivity.kt"
      - "tools/qa/test_gesture_handle_switch.py"
      - ".github/workflows/gesture-handle-switch-qa.yml"
  pull_request:
    paths:
      - "src/org/uwuaosp/settingsext/interfaceui/InterfaceSettingsActivity.kt"
      - "tools/qa/test_gesture_handle_switch.py"
      - ".github/workflows/gesture-handle-switch-qa.yml"
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            src/org/uwuaosp/settingsext/interfaceui/InterfaceSettingsActivity.kt
            tools/qa/test_gesture_handle_switch.py
          sparse-checkout-cone-mode: false
      - run: python3 -m unittest discover -s tools/qa -p test_gesture_handle_switch.py -v
